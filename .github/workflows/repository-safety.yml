name: repository-safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sensitive-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/repository_safety.py
      - run: python scripts/repository_safety.py --history --ref HEAD
