name: quality

on:
  push:
    branches: [closure/cdp-target, main, phase8-20-claim-bundle-optimization, fix/strict-claim-form-identity-gate]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-evidence:
    if: github.ref != 'refs/heads/closure/cdp-target' && github.head_ref != 'closure/cdp-target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Inspect required external evidence
        run: python scripts/production_evidence_preflight.py --output production_evidence_preflight.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-preflight
          path: production_evidence_preflight.json

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: git diff --check
      - run: python scripts/check_architecture.py
      - name: Track B control-plane lint
        run: ruff check evaluation/track_b*.py evaluation/qualification_closure.py evaluation/annotation_app/qualification_review.py
      - name: Track B control-plane types
        run: mypy --follow-imports=silent --ignore-missing-imports evaluation/track_b*.py evaluation/qualification_closure.py evaluation/annotation_app/qualification_review.py
      - run: ruff check evaluation/strict_identity_cached_replay.py evaluation/real_archive_classification.py evaluation/build_strict_identity_routing_review.py packages/document_routing/router.py packages/document_routing/decision_service.py packages/document_routing/evidence.py packages/processing_routes/resolver.py packages/standard_form_verification/__init__.py packages/standard_form_verification/cms1500.py packages/standard_form_verification/contracts.py packages/standard_form_verification/evidence.py packages/standard_form_verification/ub04.py tests/unit/cases/test_strict_identity_adversarial_chain.py tests/unit/cases/test_strict_identity_cached_replay.py tests/unit/cases/test_strict_identity_routing_review.py
      - run: mypy --follow-imports=skip --ignore-missing-imports evaluation/strict_identity_cached_replay.py evaluation/real_archive_classification.py evaluation/build_strict_identity_routing_review.py packages/document_routing/router.py packages/document_routing/decision_service.py packages/document_routing/evidence.py packages/processing_routes/resolver.py packages/standard_form_verification
      - run: ruff check packages/runtime_profile packages/evidence_decision packages/production_readiness_gate.py evaluation/phase8_12_tesseract_confirmation.py evaluation/phase8_12_reproducibility.py
      - run: ruff check packages/hitl_reduction evaluation/hitl_reduction_program.py tests/unit/cases/test_hitl_reduction_program.py
      - run: mypy --follow-imports=skip --ignore-missing-imports packages/hitl_reduction evaluation/hitl_reduction_program.py
      - run: ruff check packages/production_evidence.py scripts/production_evidence_preflight.py tests/unit/cases/test_production_evidence_preflight.py
      - run: mypy --follow-imports=skip --ignore-missing-imports packages/production_evidence.py scripts/production_evidence_preflight.py
      # Closure CI must not depend on private cohorts or replay frozen Track A.
      - name: Track B synthetic qualification and architecture
        if: github.ref == 'refs/heads/closure/cdp-target' || github.head_ref == 'closure/cdp-target'
        run: >-
          python -m pytest tests/architecture
          tests/unit/cases/test_track_b_hardening.py
          tests/unit/cases/test_track_b_final_inputs.py
          tests/unit/cases/test_closure_control_plane.py
          tests/unit/cases/test_qualification_closure_inputs.py
          tests/unit/cases/test_qualification_review_ui.py
          tests/unit/cases/test_qualification_review_smoke.py
          tests/unit/cases/test_qualification_worker_restart.py
          tests/unit/cases/test_production_qualification.py
          tests/unit/cases/test_production_latency.py
          tests/unit/cases/test_release_scoring_cost_closure.py
          tests/unit/cases/test_load_cost_governance.py
          tests/unit/cases/test_total_cost_model.py
          -q -p no:cacheprovider --basetemp="${RUNNER_TEMP}/pytest"
      - name: Full unit and architecture suite
        if: github.ref != 'refs/heads/closure/cdp-target' && github.head_ref != 'closure/cdp-target'
        run: python -m pytest tests/unit tests/architecture -q -p no:cacheprovider --basetemp="${RUNNER_TEMP}/pytest"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/integration -q -p no:cacheprovider --basetemp="${RUNNER_TEMP}/integration"

  governed-replay:
    if: github.ref != 'refs/heads/closure/cdp-target' && github.head_ref != 'closure/cdp-target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m evaluation.phase8_12_reproducibility replay | tee phase8_12_replay_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-12-governed-replay
          path: |
            phase8_12_replay_report.json
            evaluation/baselines/phase8_12/manifest.json

  policy-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit/cases/test_production_readiness_gate.py tests/unit/cases/test_route_registry.py tests/unit/cases/test_hitl_reduction_program.py tests/integration/test_phase8_10b_runtime_profile_parity.py -q -p no:cacheprovider --basetemp="${RUNNER_TEMP}/governance"

  evaluation-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/evaluation_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/evaluation_ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test -- --run
      - run: npm run build
