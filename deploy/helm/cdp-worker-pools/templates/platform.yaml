apiVersion: v1
kind: ServiceAccount
metadata: {name: cdp-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: cdp-worker-config}
data:
{{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: cdp-workers-default-deny}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: cdp}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: cdp-workers-approved-egress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: cdp}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [redpanda, postgresql, redis, minio]}]}
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9000}
