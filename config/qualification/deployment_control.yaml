object_store_access_key_env: OBJECT_STORE_ACCESS_KEY
object_store_secret_key_env: OBJECT_STORE_SECRET_KEY
authority_config_env: CDP_QUAL_AUTHORITY_CONFIG
pricing_config_env: CDP_QUAL_PRICING_CONFIG
# Same explicit executable/hash contract as qualification_deployment.example.json.
jobs: {}
cdp_services:
  qualification_environment: false
  pipeline_configuration_sha256: ""
  ingestion_url: ""
  tenant_id: ""
  authorization_env: ""
  database_url_env: DATABASE_URL
  ub04_canary_fingerprints: {}
  deployment_id: ""
  candidate_commit_sha: 2a310ed51720b854cca99d361940eb929027e529
  deployment_attestation_sha256: ""

# Required secure broker connectivity probe, owned by the deployment operator.
# Use its actual TLS/SASL/OAuth/mTLS implementation; there is no plaintext fallback.
broker_probe:
  argv: []
  executable_sha256: ""
  timeout_seconds: 10
  required_env: []
# jobs.<PHASE>.max_attempts is optional (default 1), bounded to 1..5.
