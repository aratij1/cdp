# Contract only. No host or credential values are supplied.
governed: false
qualification_host: ""
environment: ""
execution_provider: ""
deployment_id: ""
approval_reference: ""
database_url_env: DATABASE_URL
broker_url_env: KAFKA_BOOTSTRAP_SERVERS
