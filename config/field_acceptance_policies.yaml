  UB04:
    member_id:
      criticality: C1
      required: false
      blocks_stp: true
      requires_review_when_unresolved: true
      business_impact: member identity context
      identity_impact: medium
      downstream_consumers: [member_matching, claim_submission]
      reason: Preserve the frozen blocking behavior with explicit ownership.
    patient_name:
      criticality: C2
      required: true
      blocks_stp: true
      requires_review_when_unresolved: true
      business_impact: patient identity
      identity_impact: high
      downstream_consumers: [member_matching, claim_submission]
      reason: Required identity attribute.
    patient_dob:
      criticality: C2
      required: true
      blocks_stp: true
      requires_review_when_unresolved: true
      business_impact: patient identity and eligibility
