# Per-field confidence thresholds for CMS-1500 (see
# packages/validation_rules/thresholds.py). Fields not listed here fall
# back to the criticality-based default (0.90 critical / 0.70
# non-critical). Criticality reflects claims-processing impact: an error
# in a payment-affecting or identity field (NPI, tax ID, charges,
# diagnosis) can misroute or mispay a claim; an error in a free-text
# field is reviewable/correctable downstream at much lower cost.
- field_name: insured_id_number
  criticality: CRITICAL
  min_confidence: 0.92
  rule: required_field
- field_name: patient_name
  criticality: CRITICAL
  min_confidence: 0.90
  rule: required_field
- field_name: insured_name
  criticality: CRITICAL
  min_confidence: 0.90
  rule: required_field
- field_name: federal_tax_id
  criticality: CRITICAL
  min_confidence: 0.95
  rule: tax_id_syntax
- field_name: diagnosis_codes
  criticality: CRITICAL
  min_confidence: 0.90
  rule: icd10_syntax
- field_name: total_charge
  criticality: CRITICAL
  min_confidence: 0.95
  rule: non_negative_currency
- field_name: rendering_provider_npi
  criticality: CRITICAL
  min_confidence: 0.92
  rule: npi_luhn_checksum
- field_name: cpt_hcpcs
  criticality: CRITICAL
  min_confidence: 0.90
  rule: cpt_hcpcs_syntax
- field_name: modifier
  criticality: NON_CRITICAL
  min_confidence: 0.75
  rule: modifier_syntax
- field_name: patient_dob
  criticality: NON_CRITICAL
  min_confidence: 0.80
  rule: date_not_future
- field_name: patient_address
  criticality: NON_CRITICAL
  min_confidence: 0.60
- field_name: insured_address
  criticality: NON_CRITICAL
  min_confidence: 0.60
- field_name: insured_policy_group
  criticality: NON_CRITICAL
  min_confidence: 0.65
- field_name: patient_account_no
  criticality: NON_CRITICAL
  min_confidence: 0.60
- field_name: amount_paid
  criticality: NON_CRITICAL
  min_confidence: 0.70
- field_name: billing_provider_info
  criticality: NON_CRITICAL
  min_confidence: 0.65
