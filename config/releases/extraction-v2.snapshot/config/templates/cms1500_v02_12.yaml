# CMS-1500 (NUCC-approved, revision 02/12) -- "HEALTH INSURANCE CLAIM FORM".
# Field regions are pixel coordinates against reference_dimensions, derived
# by visual inspection of a real sample scan from the supplied dataset
# (Group A, single-page Bundle A) -- see docs/DATASET_FINDINGS.md. These
# are deliberately coarse (box-level, not character-level) and are meant
# to be refined by an operator calibration pass; OpenCV alignment
# (packages.templates + workers.page_detection) maps each incoming scan
# onto this reference before any region is read, so small offsets here are
# tolerated as long as the padding used by regional OCR is generous enough.
template_id: cms1500
version: "02-12"
form_type: CMS1500

reference_dimensions:
  width_px: 1712
  height_px: 2214

# Optional: a real, operator-supplied clean/representative scan of this
# form, path relative to this file. Drop one at
# config/templates/reference_images/cms1500_v02_12.png (gitignored -- never
# commit a real scan) to unlock real OpenCV alignment (grid-signature +
# ORB/homography) in place of the anchor-phrase-only / rescale-only
# fallback. Absent by default; nothing else here needs to change.
reference_image_path: null

anchor_definitions:
  - phrase: "HEALTH INSURANCE CLAIM FORM"
    required: true
  - phrase: "APPROVED BY NATIONAL UNIFORM CLAIM COMMITTEE"
    required: true
  - phrase: "PICA"
    required: true
  - phrase: "FORM 1500"
    required: false

